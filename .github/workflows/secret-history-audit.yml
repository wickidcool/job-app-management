# ADR-0001 Addendum A, Layer 0 — full-history secret baseline audit.
#
# WHY THIS EXISTS (WIC-1070): Layers 1-2 are diff-scoped, so they only ever see the
# commits in the current push. A secret committed before the layer was installed --
# or in any push older than the current one -- is invisible to them forever.
# WIC-1070 is that exact case: a Google OAuth token committed 2020-09-06, absent from
# HEAD, undetected for ~6 years, surfaced only when full-history scanning was enabled.
#
# This runs the *whole* history, on a schedule, and needs no paid GitHub SKU -- so it
# is the only historical-secret control available on Free/Team private repos.
name: Secret history audit (Layer 0)

on:
  schedule:
    - cron: '17 6 * * 1'      # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write               # to file a finding; no code write access

concurrency:
  group: secret-history-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    # WIC-1095: bound the job. Baseline is ~15s, but this downloads a release
    # tarball over the network and does a full-history clone, and an unbounded
    # job on a *scheduled* workflow is the worst case — nobody is watching, so a
    # wedged run silently holds a runner slot for GitHub's 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # REQUIRED: shallow clone silently reduces this to a diff scan

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSLo /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Guard: fetch-depth:0 is load-bearing. If a future edit drops it, the scan
      # silently degrades to a diff scan that always passes. Fail loudly instead.
      - name: Assert full history was fetched
        run: |
          set -euo pipefail
          if [ -f .git/shallow ]; then
            echo "::error::Shallow clone detected - the audit would only scan part of history. Restore 'fetch-depth: 0' on actions/checkout."
            exit 1
          fi
          echo "Commits in history: $(git rev-list --count --all)"

      # Baseline: findings already triaged (e.g. remediated-but-still-in-history) live in
      # .gitleaks-baseline.json so the audit reports only what is NEW since last triage.
      #
      # --redact is REQUIRED and load-bearing, for two reasons:
      #   1. A gitleaks JSON report contains the secret VALUE verbatim in .Secret/.Match.
      #      The baseline is a committed report, so an unredacted baseline would republish
      #      every triaged secret into HEAD -- on public repos that is strictly worse than
      #      the history leak it documents.
      #   2. gitleaks only skips the .Secret/.Match equality check when redacting, so a
      #      redacted baseline ONLY suppresses if the scan is also redacted. Drop --redact
      #      here and every baselined finding silently returns and the job fails forever.
      - name: Full-history scan
        id: scan
        run: |
          set -euo pipefail
          BASELINE=()
          [ -f .gitleaks-baseline.json ] && BASELINE=(--baseline-path .gitleaks-baseline.json)
          gitleaks git . \
            --config .gitleaks.toml \
            "${BASELINE[@]}" \
            --report-path gitleaks-history.json \
            --report-format json \
            --redact \
            --no-banner \
            --exit-code 0
          COUNT=$(python3 -c "import json;print(len(json.load(open('gitleaks-history.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Full-history findings: $COUNT"

      # Never upload the report: it contains the secret values verbatim.
      - name: Summarise (values redacted)
        if: steps.scan.outputs.count != '0'
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('gitleaks-history.json'))
          print(f"## Secret history audit — {len(d)} finding(s)\n")
          print("| Rule | File | Commit | Date |")
          print("|---|---|---|---|")
          for f in d:
              print(f"| `{f['RuleID']}` | `{f['File']}` | `{f['Commit'][:8]}` | {f['Date'][:10]} |")
          print("\nValues are deliberately not printed. Inspect the commit locally.")
          PY

      - name: Fail the audit
        if: steps.scan.outputs.count != '0'
        run: |
          echo "::error::Full-history secret audit found ${{ steps.scan.outputs.count }} finding(s). See the job summary."
          exit 1
