name: Set Worker Secrets

on:
  workflow_dispatch:
    inputs:
      # WIC-2099: named `target_env` and NOT `environment`, deliberately.
      # This is the Cloudflare Workers env passed to `wrangler --env`. It has
      # nothing to do with the *job-level* `environment:` key below, which is
      # what GitHub resolves `secrets.*` against. While this input was named
      # `environment`, `grep -n 'environment:'` returned a hit on this line and
      # the missing job key read as present — which is exactly how the bug
      # below survived review. Do not rename it back.
      #
      # WIC-2105: `preview` is the ONLY option. `dev` and `staging` were offered
      # and had zero consumers — swept every `--env` occurrence under `.github`
      # at main a9d7186 and all are the literal `preview`, except the
      # parameterized one in this workflow. Positive control (`--env preview`)
      # returned hits in deploy.yml and remediate-worker-secret-leak.yml, so the
      # zero is a real zero and not an anchored-regex artifact.
      #
      # ⚠️ Which wrangler config this resolves is NOT the root `wrangler.jsonc`.
      # The secret-put step below sets `working-directory: packages/api`, so
      # wrangler reads `packages/api/wrangler.toml`, which declares `[env.dev]`,
      # `[env.preview]` and `[env.staging]`. Those blocks existing is exactly
      # why the removed options looked plausible. They are still dead — nothing
      # dispatches them and no other workflow targets those Workers — but do not
      # re-derive "undeclared" from the root config; it is the wrong file for
      # this workflow. See WIC-2107 for the target-Worker discrepancy that same
      # `working-directory` causes.
      target_env:
        description: 'Target Cloudflare Workers environment (wrangler --env)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview

jobs:
  set-secrets:
    name: Push secrets to Cloudflare Worker
    runs-on: ubuntu-latest
    # WIC-1095: bound the job; GitHub's default is 6h, which turns any wedged
    # network call into a runner slot held all day.
    timeout-minutes: 20
    # WIC-2099: REQUIRED, not decorative. CLOUDFLARE_API_TOKEN,
    # CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY do not exist as repo-level
    # secrets — measured 2026-09-05, the repo-level list holds only
    # CLOUDFLARE_CAREERPIN_API. They exist ONLY as *environment* secrets, on
    # both `dev` and `production`. Without this key all three interpolate to
    # the empty string and `wrangler secret put` runs unauthenticated —
    # demonstrated on run 33972091515, where the step's env block printed
    # CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY empty.
    #
    # `dev` rather than `production` because this workflow only ever targets
    # preview/dev/staging, and `deploy.yml`'s `deploy-preview` job — which
    # performs this same preview secret push in its "Sync preview Worker
    # secrets" step — also runs under `environment: dev`. Least privilege, and
    # consistent with the job that already does this.
    #
    # This adds no human gate: `dev` has `protection_rules: []`, so a dispatch
    # reaches these secrets directly.
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # WIC-2099: fail with a message that names the actual cause. Wrangler does
      # refuse on an empty *token* and names the variable, but it cannot know
      # WHY the variable is empty — that the job is missing its `environment:`
      # key — which is what this step supplies.
      #
      # ANTHROPIC_API_KEY is checked for a stronger reason: wrangler only
      # guards the token. With credentials present and this key empty,
      # `wrangler secret put` stores the empty string and prints
      # "✨ Success!", silently disabling the Worker's AI features.
      - name: Verify required secrets resolved
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # No `set -x` — the secrets are in scope in this block.

          missing=''
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY; do
            if [ -z "${!name:-}" ]; then
              missing="${missing} ${name}"
            fi
          done

          if [ -n "$missing" ]; then
            echo "FATAL: these secrets resolved to the empty string:${missing}"
            echo
            echo "This is almost certainly NOT a revoked or expired credential."
            echo "All three exist only as GitHub *environment* secrets (on 'dev'"
            echo "and 'production'), never at repo level. Check that this job"
            echo "still declares the job-level 'environment:' key."
            echo
            echo "Note the decoy: the workflow_dispatch input is named"
            echo "'target_env' precisely so that a 'grep environment:' hit means"
            echo "the job key and nothing else."
            exit 1
          fi

          echo "All three required secrets are present and non-empty."

      - name: Set ANTHROPIC_API_KEY on Worker
        working-directory: packages/api
        run: echo "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY --env ${{ inputs.target_env }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
