name: Remediate Worker Secret Leak (WIC-751)

# Containment for WIC-751: a secret_text binding was created with the entire
# KEY=VALUE string as its NAME (literally "ANTHROPIC_API_KEY=sk-ant-api03-...").
# Cloudflare returns binding NAMES in plaintext via the Worker settings API, so
# the key value is readable by anyone with the CF token. This workflow deletes
# ONLY malformed bindings whose name contains "=" on the jobtrail (production)
# and jobtrail-preview Workers, then re-lists to verify. Binding names are
# masked so the secret is not re-leaked into CI logs. It does NOT touch the
# correctly-named ANTHROPIC_API_KEY binding and does NOT rotate the key
# (rotation is tracked separately on approval d5cfcdeb).
#
# Board-approved for containment: approval ba96d314.
# Manual dispatch only — never runs on push, so it cannot trigger a deploy.
#
# Credential scoping (matches deploy.yml / deploy-marketing.yml):
#   - jobtrail (production) lives in the careerpin account -> CLOUDFLARE_CAREERPIN_API
#     (repo-level). No account-ID secret exists for it, so we resolve it via the
#     /accounts API, exactly like deploy-marketing.yml, and pass it to wrangler
#     so wrangler skips the /memberships lookup (which the token can't read).
#   - jobtrail-preview lives in the account whose creds are in the `dev`
#     environment -> CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which Worker(s) to clean'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - production
          - preview

jobs:
  clean-production:
    name: Clean jobtrail (production)
    if: ${{ inputs.target == 'both' || inputs.target == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve careerpin account ID
        id: cf-account
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_CAREERPIN_API }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts")
          COUNT=$(echo "$RESPONSE" | jq '.result | length')
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 CF account for CLOUDFLARE_CAREERPIN_API, got $COUNT." >&2
            exit 1
          fi
          ACCOUNT_ID=$(echo "$RESPONSE" | jq -r '.result[0].id')
          echo "::add-mask::$ACCOUNT_ID"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved careerpin account ID: ${ACCOUNT_ID:0:8}…"

      - name: Delete malformed binding on jobtrail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CAREERPIN_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf-account.outputs.account_id }}
        run: |
          set -euo pipefail
          echo "Listing secret bindings on jobtrail (production)…"
          # Capture into a var so the plaintext (leaking) name is never echoed.
          LIST="$(npx wrangler secret list)"
          MALFORMED="$(printf '%s' "$LIST" | jq -r '.[].name | select(contains("="))')"
          if [ -z "$MALFORMED" ]; then
            echo "OK: no malformed (=-containing) binding found on jobtrail."
          else
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              # Mask the full name (it contains the secret) from all later logs.
              echo "::add-mask::$name"
              echo "Deleting malformed binding on jobtrail (prefix: ${name%%=*}=<redacted>)"
              printf 'y\n' | npx wrangler secret delete "$name"
            done <<< "$MALFORMED"
          fi

      - name: Verify jobtrail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CAREERPIN_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf-account.outputs.account_id }}
        run: |
          set -euo pipefail
          LIST="$(npx wrangler secret list)"
          REMAINING="$(printf '%s' "$LIST" | jq -r '[.[].name | select(contains("="))] | length')"
          echo "jobtrail bindings (name prefixes only):"
          printf '%s' "$LIST" | jq -r '.[].name | split("=")[0]' | sort -u | sed 's/^/  - /'
          if [ "$REMAINING" != "0" ]; then
            echo "FAIL: $REMAINING malformed binding(s) still present on jobtrail." >&2
            exit 1
          fi
          echo "PASS: no =-containing binding remains on jobtrail."

  clean-preview:
    name: Clean jobtrail-preview
    if: ${{ inputs.target == 'both' || inputs.target == 'preview' }}
    runs-on: ubuntu-latest
    # `dev` environment holds CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID for
    # the account where jobtrail-preview lives (same as deploy.yml Deploy Preview).
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Keeps the correctly-named ANTHROPIC_API_KEY; deletes only the malformed one.
      - name: Delete malformed binding on jobtrail-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Listing secret bindings on jobtrail-preview…"
          LIST="$(npx wrangler secret list --env preview)"
          MALFORMED="$(printf '%s' "$LIST" | jq -r '.[].name | select(contains("="))')"
          if [ -z "$MALFORMED" ]; then
            echo "OK: no malformed (=-containing) binding found on jobtrail-preview."
          else
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              echo "::add-mask::$name"
              echo "Deleting malformed binding on jobtrail-preview (prefix: ${name%%=*}=<redacted>)"
              printf 'y\n' | npx wrangler secret delete "$name" --env preview
            done <<< "$MALFORMED"
          fi

      - name: Verify jobtrail-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LIST="$(npx wrangler secret list --env preview)"
          REMAINING="$(printf '%s' "$LIST" | jq -r '[.[].name | select(contains("="))] | length')"
          echo "jobtrail-preview bindings (name prefixes only):"
          printf '%s' "$LIST" | jq -r '.[].name | split("=")[0]' | sort -u | sed 's/^/  - /'
          if [ "$REMAINING" != "0" ]; then
            echo "FAIL: $REMAINING malformed binding(s) still present on jobtrail-preview." >&2
            exit 1
          fi
          echo "PASS: no =-containing binding remains on jobtrail-preview."
