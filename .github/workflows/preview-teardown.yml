name: Preview Teardown

# WIC-1357: deploy.yml gives each PR its own preview Worker (jobtrail-preview-pr<N>).
# Without a teardown those scripts accumulate on the account forever — and once the
# Workers script cap is hit, EVERY preview deploy (and eventually the production
# deploy) starts failing. So this is the main new failure mode per-PR Workers
# introduce, and it must fail LOUDLY: a delete that errors for any reason other than
# "already gone" makes this job red so the accumulation is visible, not silent.
on:
  pull_request:
    types: [closed]
    branches: ['**']

# One teardown per PR; never cancel a delete in flight.
concurrency:
  group: preview-teardown-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delete-preview-worker:
    name: Delete per-PR preview Worker
    runs-on: ubuntu-latest
    # Same environment as deploy-preview so it reads the same dev-scoped
    # Cloudflare credentials that created the Worker.
    environment: dev
    timeout-minutes: 5
    steps:
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$CF_API_TOKEN" ]  && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Required secrets not configured:$missing — cannot delete the per-PR preview Worker, which will then accumulate toward the script cap."
            exit 1
          fi
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete jobtrail-preview-pr${{ github.event.pull_request.number }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          name="jobtrail-preview-pr${PR_NUMBER}"
          # Delete via the REST API rather than `wrangler delete`: no interactive
          # confirmation prompt to defeat in CI, and the HTTP status is an
          # unambiguous success/not-found/error signal. `force=true` lets the delete
          # proceed even if the script were referenced elsewhere (it is not here).
          resp="$(mktemp)"
          code=$(curl -sS -o "$resp" -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${name}?force=true")
          echo "HTTP ${code}"
          cat "$resp"
          echo
          if [ "$code" = "200" ]; then
            echo "::notice::Deleted preview Worker ${name}."
          elif [ "$code" = "404" ]; then
            # Never created (non-DB PR that never deployed, or a PR opened before
            # WIC-1357 shipped), or already torn down by a prior close event.
            echo "::notice::Preview Worker ${name} not found — nothing to delete."
          else
            echo "::error::Failed to delete preview Worker ${name} (HTTP ${code}). Per-PR preview Workers will accumulate toward the account script cap until this is resolved — delete it manually with: wrangler delete --name ${name}"
            exit 1
          fi
