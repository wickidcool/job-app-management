name: Deploy

on:
  push:
    branches: [main]
  # Run PR checks regardless of base branch. `branches:` filters the BASE, so
  # `[main]` silently gave stacked PRs (e.g. #92 -> #89, #93 -> #92) zero checks
  # while GitHub still reported them mergeable — a green-looking PR that had in
  # fact never been built. Production deploys stay gated on `push` to `main`
  # (see the `deploy-production` job's `if:`), so this only widens PR coverage.
  pull_request:
    branches: ['**']
  # WIC-1260: manual production deploy / rollback lever. Before this, the ONLY
  # route to production was a non-`[skip ci]` push to `main` — so 14 consecutive
  # `[skip ci]` merges left the lane unexercised for 6 days with no way to run it
  # on demand, and no way to redeploy a known-good ref after a bad release.
  # Dispatching this workflow deploys whatever `ref` you pick, at that ref's tree.
  # It is a real production deploy and stays board-gated like any other.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you deploying manually? (recorded in the run summary)'
        required: true
        type: string

env:
  NODE_VERSION: '20'

# WIC-1095: supersede stale PR runs so an abandoned commit cannot hold a
# concurrent-job slot for GitHub's 6h default. cancel-in-progress is scoped to
# pull_request on purpose — on a push to main this run contains
# `deploy-production` (wrangler deploy + DB migrations), and cancelling that
# mid-flight is a far worse failure than a redundant run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    # WIC-1095: every job is bounded. Without this GitHub applies a 6h default,
    # so a wedged network call becomes a permanently-pending required check that
    # occupies a runner slot instead of failing visibly. Baseline ~1m15s.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # ADR-0001 Pillar 3 (WIC-879): fail the build if secret-shaped material
      # (API keys, tokens, private keys) appears in a committed non-secret field
      # — binding names, resource names, labels, or any tracked file. Secrets
      # belong only in the secret store / injected env. Allowlist false positives
      # in .github/secret-scan-allowlist.json.
      - name: Scan for leaked secret material
        run: npm run scan:secrets

      - name: Run type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      # WIC-1195: the wireframes drifted out of sync with the components they
      # describe four times (WIC-1127, -1184, -1187, -1205), each time caught by
      # a reader rather than a check. This fails the build on a new unmarked
      # all-caps label instead, so the next one is a red check, not ticket five.
      - name: Audit wireframe casing
        run: python3 docs/design/wireframe-casing-audit.py

      # WIC-1302: docs/analytics/dashboard-templates.json and console-build-runbook.md
      # are generated artifacts of insight-payloads.json + make_console_pack.py (PR #109).
      # The guarantee was procedural — the two-step regen lives only in the generator's
      # stdout — so an edit to an input that skipped regeneration could land a stale pack
      # on main silently; the Prettier format check does not cover docs/** and so misses it.
      # This regenerates and diffs. A non-empty diff = an input changed without regen.
      # The generator exits 1 by design when a payload has neither inline HogQL nor a
      # _hogql_variant fallback; set -e surfaces that as a real failure, not a silent one.
      # Runs unconditionally (not paths-filtered): the check is ~1s and deterministic,
      # and always-on guarantees the pack is in sync on every merge regardless of route.
      - name: Verify console pack is regenerated from insight-payloads.json
        run: |
          set -euo pipefail
          python3 docs/analytics/make_console_pack.py
          npx prettier --write docs/analytics/dashboard-templates.json docs/analytics/console-build-runbook.md
          git diff --exit-code docs/analytics/dashboard-templates.json docs/analytics/console-build-runbook.md

      # WIC-1582: ROUTE_TITLE_CONVENTION.md §5 is a copy of strings that live in
      # source, and it spent eight days outside the repo drifting — a heading moved
      # file, the 404's copy changed, and a route was added with no row. All three
      # were found by a careful reader. This fails the build on the next one, and in
      # particular on a new <Route> added without a title row.
      - name: Audit route title table
        run: python3 docs/design/route-title-table-audit.py

      # WIC-1626: the other half of WIC-1582. Three design docs cited sibling
      # specifications by filename that existed only in an agent's private
      # workspace, so an implementer told to obey "NOTFOUND_PAGE_DESIGN_SPEC.md
      # §1, D2" could not open it — the constraint did not really exist. A fourth
      # dangling reference turned up in docs/analytics on this script's first run.
      # This fails the build on the next citation of a document nobody can read.
      - name: Audit design-doc references
        run: python3 docs/design/doc-reference-audit.py

      # WIC-1670: `ConfirmationModal`'s `restoreFocusTo` prop is optional — correctly,
      # since a cancel-only dialog whose trigger survives must not be forced to name a
      # fallback. But that means a call site whose confirm action destroys its own
      # trigger reintroduces WIC-1181 with no type error, no lint error and no failing
      # test, and the author cannot catch it by inspection because the failure is an
      # ordering race. This makes every call site declare: pass the prop, or say in a
      # `focus-restore-exempt` comment why the trigger survives.
      - name: Audit ConfirmationModal focus restore
        run: python3 docs/design/confirmation-modal-focus-audit.py

      # WIC-1664: build_dashboards.py rewrites HogQL by string index to inject the
      # synthetic-traffic exclusion, and that fails silently — it emits plausible SQL
      # whose predicate does not actually bind, and the tile still renders, just against
      # probe residue. `apply_exclusion` only aborts on *zero* filtered sites, so a
      # rewrite that reports one site and filters nothing ships green. The live half of
      # the check needs a PostHog key (`build_dashboards.py --dry-run`); this half needs
      # no credential, so it runs on every PR.
      - name: Analytics synthetic-exclusion self-test
        run: python3 docs/analytics/build_dashboards_selftest.py

      # WIC-1358: organic_watch.py is the sole release trigger for the WIC-1024 hold, and
      # its failure mode is going blind rather than going loud — PostHog's synchronous
      # /query/ leg began 504-ing on any HogQL touching `events`, so the watcher returned
      # exit 1 on every run and would have returned exit 1 on the day a real first user
      # arrived. The fallback to the async leg is what makes it able to fire at all, and
      # nothing ran its 70 self-test cases until this step existed. Needs no credential:
      # every case stubs the transport.
      - name: Organic-watch dispatch self-test
        run: python3 docs/analytics/organic_watch.py --selftest

      - name: Run tests
        run: npm run test

      - name: Build packages
        run: npm run build

  e2e-tests:
    name: E2E Tests
    needs: lint-and-test
    runs-on: ubuntu-latest
    # WIC-1095: baseline for this job is ~2m45s. 15 minutes is ~5x headroom and
    # converts the apt/mirror hang that stranded 10 runs on 2026-08-19 into a
    # red check in 15 min rather than a pending one for 6h.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # WIC-1095: apt has NO default network timeout, so a connection to a
      # degraded mirror (azure.archive.ubuntu.com, 2026-08-19) never returns and
      # `playwright install --with-deps` hangs forever. This config file is read
      # by *every* apt invocation, including the one Playwright shells out to
      # internally, which a flag on our own apt call would not cover.
      - name: Harden apt against a degraded mirror
        timeout-minutes: 2
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ftp::Timeout "30";
          EOF

      # WIC-1095: the browser download is ~90s of the step on every run. Keyed on
      # the lockfile so a Playwright version bump busts it; a miss just costs the
      # download back.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # Split from the browser download so the log tells us which half stalled,
      # and step-bounded so a wedged apt burns 6 minutes rather than the whole
      # 15-minute job budget — leaving the tests themselves room to still run.
      - name: Install Playwright system dependencies
        timeout-minutes: 6
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          TEST_USER2_EMAIL: ${{ secrets.E2E_TEST_USER2_EMAIL }}
          TEST_USER2_PASSWORD: ${{ secrets.E2E_TEST_USER2_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # WIC-1203: does this PR change anything that writes to the shared dev
  # database? Only such PRs need to serialize against each other (see the
  # deploy-preview concurrency group below). Runs in parallel with
  # lint-and-test, which is several times slower, so it costs no wall-clock.
  detect-db-changes:
    name: Detect DB Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      touches_db: ${{ steps.check.outputs.touches_db }}
    steps:
      # Queried over the API rather than via checkout+diff: the merge ref's
      # merge base is not always what `git diff` against the checked-out base
      # would give on a stacked PR, and this needs no working tree at all.
      - name: Check for DB-affecting paths
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          echo "Changed files:"
          echo "$files"
          # Everything the preview deploy's migration step can write:
          # drizzle migrations + schema, and the idempotent RLS apply script.
          # verify-rls.mjs is read-only but is included so a change to the
          # gate itself is also serialized.
          if printf '%s\n' "$files" | grep -qE '^(packages/api/src/db/(migrations/|schema\.ts)|packages/api/scripts/(apply|verify)-rls\.mjs|supabase/migrations/)'; then
            echo "touches_db=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR touches the database — preview deploy will serialize on the shared dev DB."
          else
            echo "touches_db=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR does not touch the database — preview deploy runs in parallel."
          fi

  deploy-preview:
    name: Deploy Preview
    # Only requires lint-and-test — E2E tests need a live environment and
    # should not gate PR preview deploys.
    needs: [lint-and-test, detect-db-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # WIC-1095: baseline ~1m5s.
    timeout-minutes: 20
    # WIC-1203: this job migrates the *shared* dev database, so two PRs racing
    # here can both read the drizzle journal as un-applied and both attempt the
    # same DDL. The workflow-level group above only serializes pushes to the
    # SAME ref, which does not help across PRs.
    #
    # A blanket constant group would serialize all ~20 open PRs' previews behind
    # each other, and because GitHub keeps only ONE pending run per group
    # (queueing a third cancels the second), it would also silently drop preview
    # deploys under load. So the group is constant only for the PRs that can
    # actually collide on the DATABASE; every other PR keeps a per-PR group.
    #
    # cancel-in-progress is false on purpose: cancelling a migration mid-flight
    # is the failure this is meant to prevent. Superseding repeated pushes to one
    # PR is already handled by the workflow-level group (WIC-1095).
    #
    # WIC-1343 — SCOPE CORRECTION. This key protects the shared dev *database*
    # only. The shared `jobtrail-preview` *Worker* is a second contended resource
    # that `touches_db` cannot see, and non-DB PRs land in distinct groups and hit
    # it concurrently by design. It is deliberately NOT folded into this group:
    # widening the constant group to every PR would reintroduce exactly the
    # silent-preview-drop failure described above. The Worker race is handled
    # where it happens instead — see the deploy/secret-sync steps below.
    concurrency:
      group: ${{ needs.detect-db-changes.outputs.touches_db == 'true' && 'preview-db-migrate' || format('preview-deploy-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    environment: dev
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ]         && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ANON_KEY" ]    && missing="$missing SUPABASE_ANON_KEY"
          [ -z "$SUPABASE_JWT_SECRET" ]  && missing="$missing SUPABASE_JWT_SECRET"
          [ -z "$SUPABASE_DATABASE_URL" ] && missing="$missing SUPABASE_DATABASE_URL"
          [ -z "$CF_API_TOKEN" ]         && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT_ID" ]        && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Required secrets/vars not configured:$missing"
            echo "Set these in GitHub → Settings → Secrets and variables (repo or 'dev' environment)."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ADR-0001 Pillar 1 (WIC-878): authenticated pings, not just presence checks.
      # Catches a dead/mis-scoped Cloudflare token or stale Supabase creds loudly here
      # instead of deep in the deploy/migration as an opaque 401/403.
      # WIC-903: re-adopted advisory-first (continue-on-error) after hardening the
      # Cloudflare probe. CLOUDFLARE_ACCOUNT_ID is passed so the CF check hits the
      # account-scoped token-verify endpoint — a least-privilege, account-scoped
      # Workers+R2 deploy token (the correct CI token) 401s on the user-scoped one.
      # WIC-1009: the PRODUCTION job's copy of this step is now a hard gate. This
      # preview copy stays advisory until WIC-760 is resolved: the dev-environment
      # CLOUDFLARE_API_TOKEN is independently dead, so hard-gating here would only
      # move an already-failing preview deploy's failure earlier and could mask
      # unrelated PR feedback. Flip this one too once WIC-760 lands a live token.
      - name: Credential preflight (authenticated, advisory)
        continue-on-error: true
        run: npm run -w @wic/api preflight -- cloudflare supabase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Run database migrations
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DATABASE_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
          SUPABASE_POOLER_REGION: ${{ vars.SUPABASE_POOLER_REGION }}
          SUPABASE_POOLER_PREFIX: ${{ vars.SUPABASE_POOLER_PREFIX }}
        run: |
          # Mirror the production migration step: reconstruct the transaction-pooler URL
          # from SUPABASE_DATABASE_PASSWORD + parts, so a stale/placeholder SUPABASE_DATABASE_URL
          # cannot break auth. Falls back to a directly-provided postgresql:// URL (port 6543).
          # PROJECT_REF is derived from the https:// REST SUPABASE_URL var.
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed 's|https://||' | sed 's|\.supabase\.co.*||')
          REGION="${SUPABASE_POOLER_REGION:-us-east-1}"
          PREFIX="${SUPABASE_POOLER_PREFIX:-aws-1}"
          if [ -n "$SUPABASE_DATABASE_PASSWORD" ]; then
            # Primary path: reconstruct from parts. URL-encode the password so special chars are safe.
            ENC_PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DATABASE_PASSWORD"], safe=""))')
            DATABASE_URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@${PREFIX}-${REGION}.pooler.supabase.com:6543/postgres"
          elif [[ "$SUPABASE_DATABASE_URL" == postgresql://* ]]; then
            # Fallback: a full Postgres URL was provided directly — normalize to transaction pooler port.
            DATABASE_URL="${SUPABASE_DATABASE_URL/:5432\//:6543/}"
          else
            echo "::error::No usable Supabase DB credentials — set SUPABASE_DATABASE_PASSWORD (dev env secret) or a postgresql:// SUPABASE_DATABASE_URL"
            exit 1
          fi
          export DATABASE_URL
          npm run db:migrate --workspace=@wic/api
          # WIC-905: apply idempotent RLS + role grants, then fail the deploy if any
          # user-scoped table is not RLS-enforced (defense-in-depth for the publishable key).
          npm run db:rls --workspace=@wic/api
          npm run db:rls:verify --workspace=@wic/api

      - name: Build for preview
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Ensure preview R2 bucket exists
        # Idempotent — exits 0 even if the bucket already exists.
        run: npx wrangler r2 bucket create jobtrail-documents-dev || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # WIC-1343: the secret push is split out of wrangler-action's `secrets:`
      # input and run as a pair of explicit steps around the deploy. Why:
      #
      # wrangler-action uploads secrets BEFORE it runs `command`, and
      # `wrangler secret bulk` is a PATCH to
      # /accounts/{a}/workers/scripts/jobtrail-preview/settings — the *version
      # settings* API, which edits the latest version in place and therefore
      # requires the latest version to be the currently-deployed one. Meanwhile
      # `wrangler deploy` is upload-then-deploy, so between another job's upload
      # and its deployment (~3s of an ~8s deploy, measured on run 32921346762)
      # the Worker legitimately has latest != deployed. A concurrent
      # `secret bulk` landing in that window fails with:
      #
      #   Script edit failed. You attempted to deploy the latest version with
      #   modified settings, but the latest version isn't currently deployed.
      #   [code: 10214]
      #
      # That is what killed run 32922501694 while four sibling PRs deployed.
      # Because the old ordering put secrets first, the failure ALSO aborted the
      # job before its own `wrangler deploy` — so a run cancelled mid-deploy (the
      # workflow-level group cancels PR runs in progress) could leave the shared
      # Worker with an undeployed latest version and no run left to clear it.
      #
      # The fix is ordering, not serialization:
      #   1. try the secret sync first (advisory) so the happy path is unchanged
      #      and code never runs ahead of a rotated secret;
      #   2. deploy unconditionally — upload+deploy always leaves
      #      latest == deployed, which HEALS the state 10214 complains about;
      #   3. if and only if step 1 failed, re-sync with backoff. By now our own
      #      deploy has restored a consistent version state, so the retry only
      #      has to survive another job's ~3s window.
      #
      # `wrangler deploy` preserves existing secret_text bindings, so step 2
      # running before a successful secret sync cannot strip the Worker's
      # secrets. The production job is intentionally left alone: it only runs on
      # push/dispatch against refs/heads/main, which the workflow-level
      # concurrency group already serializes, so it has no concurrent writer.
      - name: Sync preview Worker secrets (advisory, pre-deploy)
        id: secrets_pre
        continue-on-error: true
        run: |
          # Builds the same payload wrangler-action's `secrets:` input used to
          # build, and pipes it to the same `wrangler secret bulk --env preview`
          # on stdin — so nothing is written to disk and nothing is echoed.
          # ANTHROPIC_API_KEY is optional by design (AI features degrade when it
          # is unset), so an empty value is dropped with a warning rather than
          # failing; the other four are already hard-gated by the
          # "Validate required secrets" step above.
          payload=$(python3 -c '
          import json, os, sys
          keys = ("SUPABASE_URL", "SUPABASE_ANON_KEY", "SUPABASE_JWT_SECRET", "ANTHROPIC_API_KEY", "DATABASE_URL")
          out = {k: os.environ[k] for k in keys if os.environ.get(k)}
          for k in keys:
              if k not in out:
                  print("::warning::preview secret %s is empty - not pushed to the Worker" % k, file=sys.stderr)
          json.dump(out, sys.stdout)
          ')
          attempt=1
          delay=5
          while :; do
            if printf %s "$payload" | npx wrangler secret bulk --env preview; then
              echo "::notice::Preview Worker secrets synced on attempt ${attempt}/${ATTEMPTS}."
              exit 0
            fi
            if [ "$attempt" -ge "$ATTEMPTS" ]; then
              break
            fi
            echo "::warning::wrangler secret bulk failed (attempt ${attempt}/${ATTEMPTS}). Cloudflare 10214 on the shared jobtrail-preview Worker is transient version contention (another PR's deploy is mid-flight); retrying in ${delay}s."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          echo "::error::Preview Worker secrets failed to sync after ${ATTEMPTS} attempt(s)."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ATTEMPTS: '1'
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      - name: Deploy preview to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: preview
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      # Only runs when the pre-deploy attempt failed. This is the authoritative
      # one: if it cannot get the secrets on after our own deploy has restored a
      # consistent version state, the contention is not transient and the job
      # should go red.
      - name: Re-sync preview Worker secrets (retried, post-deploy)
        if: steps.secrets_pre.outcome == 'failure'
        run: |
          # Byte-identical to the pre-deploy step except for ATTEMPTS. Kept
          # inline rather than in .github/scripts/ on purpose: skip-ci-guard's
          # allowlist is docs/ + *.md + .github/workflows/ only, so a helper
          # script would put this change outside the repo's own no-deploy path.
          payload=$(python3 -c '
          import json, os, sys
          keys = ("SUPABASE_URL", "SUPABASE_ANON_KEY", "SUPABASE_JWT_SECRET", "ANTHROPIC_API_KEY", "DATABASE_URL")
          out = {k: os.environ[k] for k in keys if os.environ.get(k)}
          for k in keys:
              if k not in out:
                  print("::warning::preview secret %s is empty - not pushed to the Worker" % k, file=sys.stderr)
          json.dump(out, sys.stdout)
          ')
          attempt=1
          delay=5
          while :; do
            if printf %s "$payload" | npx wrangler secret bulk --env preview; then
              echo "::notice::Preview Worker secrets synced on attempt ${attempt}/${ATTEMPTS}."
              exit 0
            fi
            if [ "$attempt" -ge "$ATTEMPTS" ]; then
              break
            fi
            echo "::warning::wrangler secret bulk failed (attempt ${attempt}/${ATTEMPTS}). Cloudflare 10214 on the shared jobtrail-preview Worker is transient version contention (another PR's deploy is mid-flight); retrying in ${delay}s."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          echo "::error::Preview Worker secrets failed to sync after ${ATTEMPTS} attempt(s)."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ATTEMPTS: '4'
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      # WIC-1022: the workers.dev route (jobtrail-preview.al-23f.workers.dev) sits behind
      # Cloudflare Access, so QA 302s to the login page and cannot verify a PR before it
      # ships. Cloudflare's per-version preview URL for the same build is NOT Access-gated,
      # and it pins the exact version this run deployed — which also sidesteps the
      # last-writer-wins race when several PRs deploy to the shared preview Worker.
      # `wrangler deploy` prints "Current Version ID: <uuid>"; the preview hostname is the
      # first 8 characters of that UUID prefixed onto the deployment host.
      - name: Derive Access-free preview URL
        id: preview
        env:
          WRANGLER_STDOUT: ${{ steps.deploy.outputs.command-output }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          version_id="$(printf '%s' "$WRANGLER_STDOUT" \
            | grep -oiE 'Current Version ID: [0-9a-f-]{36}' \
            | tail -n 1 | awk '{print $NF}')"
          host="${DEPLOY_URL#https://}"
          host="${host%%/*}"
          if [ -n "$version_id" ] && [ -n "$host" ]; then
            echo "version-id=$version_id" >> "$GITHUB_OUTPUT"
            echo "url=https://${version_id%%-*}-${host}" >> "$GITHUB_OUTPUT"
          else
            echo "Could not derive a version preview URL (version_id='$version_id' host='$host')."
          fi

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          VERSION_URL: ${{ steps.preview.outputs.url }}
          VERSION_ID: ${{ steps.preview.outputs.version-id }}
        with:
          script: |
            const url = process.env.DEPLOY_URL || '(URL not available — check workflow logs)';
            const versionUrl = process.env.VERSION_URL;
            const versionId = process.env.VERSION_ID;
            const lines = [
              '## Preview Deployment',
              '',
              `Deployed to: ${url}`,
              '_(behind Cloudflare Access — browser sign-in required)_',
              '',
            ];
            if (versionUrl) {
              lines.push(
                `**QA / no-login URL:** ${versionUrl}`,
                '',
                `Version \`${versionId}\`, this run's build only. Not behind Cloudflare Access,`,
                'and pinned to this commit even if another PR deploys to the shared preview',
                'Worker in the meantime.',
              );
            } else {
              lines.push(
                '**QA / no-login URL:** not available — grep this run\'s log for',
                '`Current Version ID:` and browse `https://<first-8-chars>-' +
                  `${url.replace('https://', '')}\`.`,
              );
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n'),
            })

  deploy-production:
    name: Deploy Production
    needs: [lint-and-test, e2e-tests]
    # WIC-1260: `workflow_dispatch` alone does nothing — adding it to `on:` without
    # widening this `if:` would create a run whose only real job is skipped. The
    # gate is unchanged for every other event: `pull_request` still cannot reach
    # production, it takes `deploy-preview` (env `dev`). Manual dispatch keeps the
    # same `environment: production` protection rules and the same
    # `production-deploy` concurrency group as a push, so a dispatch cannot race a
    # merge-triggered deploy.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # WIC-1095: generous on purpose — this job runs DB migrations and a wrangler
    # deploy, and a timeout that fires mid-migration is worse than a slow run.
    timeout-minutes: 45
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # WIC-1260: a manual production deploy must leave an audit trail that does
      # not depend on anyone remembering to write one. Records who dispatched it,
      # against which ref, and the stated reason.
      - name: Record manual dispatch
        if: github.event_name == 'workflow_dispatch'
        # `reason` is attacker-controllable text. It goes through `env:`, never
        # interpolated into the shell body — a `${{ }}` expansion inside `run:` is
        # substituted before bash parses the script, so a reason containing `;` or
        # `$(...)` would execute on a production-credentialed runner.
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_REF: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## Manual production deploy"
            echo ""
            echo "- **Dispatched by:** @${DISPATCH_ACTOR}"
            echo "- **Ref:** \`${DISPATCH_REF}\` @ \`${DISPATCH_SHA}\`"
            echo "- **Reason:** ${DISPATCH_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ]         && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ANON_KEY" ]    && missing="$missing SUPABASE_ANON_KEY"
          [ -z "$SUPABASE_JWT_SECRET" ]  && missing="$missing SUPABASE_JWT_SECRET"
          [ -z "$SUPABASE_DATABASE_URL" ] && missing="$missing SUPABASE_DATABASE_URL"
          [ -z "$CF_API_TOKEN" ]         && missing="$missing CLOUDFLARE_API_TOKEN(production-env)"
          if [ -n "$missing" ]; then
            echo "::error::Required secrets/vars not configured:$missing"
            echo "Set these in GitHub → Settings → Secrets and variables (repo or 'production' environment)."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ADR-0001 Pillar 1 (WIC-878): authenticated pings, not just presence checks.
      # Catches a dead/mis-scoped Cloudflare token or stale Supabase creds loudly here
      # instead of deep in the deploy/migration as an opaque 401/403.
      # WIC-903: re-adopted advisory-first (continue-on-error) after hardening the
      # Cloudflare probe. CLOUDFLARE_ACCOUNT_ID is passed so the CF check hits the
      # account-scoped token-verify endpoint — a least-privilege, account-scoped
      # Workers+R2 deploy token (the correct CI token) 401s on the user-scoped one.
      # WIC-1009: flipped to a HARD GATE. This step must fail the job before
      # "Run database migrations" below — otherwise a present-but-invalid
      # CLOUDFLARE_API_TOKEN passes the presence-only check above, migrates the
      # production database, and then dies at "Deploy to Cloudflare Workers",
      # leaving prod schema ahead of prod code. Precondition for the flip (no false
      # positives on the real prod token) was met in run 32191251045 (2026-08-18),
      # where this step concluded `success` against the live prod credentials.
      - name: Credential preflight (authenticated)
        run: npm run -w @wic/api preflight -- cloudflare supabase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      # Gated by the preflight above (WIC-1009) — do not move this step earlier.
      - name: Run database migrations
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DATABASE_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
          SUPABASE_POOLER_REGION: ${{ vars.SUPABASE_POOLER_REGION }}
          SUPABASE_POOLER_PREFIX: ${{ vars.SUPABASE_POOLER_PREFIX }}
        run: |
          # Permanent fix: set SUPABASE_DATABASE_URL to the full PostgreSQL transaction-pooler URL
          # from Supabase dashboard → Settings → Database → Connection string → Transaction pooler.
          # SUPABASE_DATABASE_URL is still the https:// REST URL, so reconstruct from known parts.
          # Use SUPABASE_POOLER_REGION variable (default: us-east-1) to set the correct region.
          # Use SUPABASE_POOLER_PREFIX variable (default: aws-1) to set the correct pooler prefix.
          # Find the correct region/prefix in Supabase dashboard → Settings → Database → Connection string.
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed 's|https://||' | sed 's|\.supabase\.co.*||')
          REGION="${SUPABASE_POOLER_REGION:-us-east-1}"
          PREFIX="${SUPABASE_POOLER_PREFIX:-aws-1}"
          if [ -n "$SUPABASE_DATABASE_PASSWORD" ]; then
            # Primary path: reconstruct from parts so a malformed/placeholder SUPABASE_DATABASE_URL
            # cannot break URL parsing. URL-encode the password so special characters are safe.
            ENC_PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DATABASE_PASSWORD"], safe=""))')
            DATABASE_URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@${PREFIX}-${REGION}.pooler.supabase.com:6543/postgres"
          elif [[ "$SUPABASE_DATABASE_URL" == postgresql://* ]]; then
            # Fallback: a full Postgres URL was provided directly — normalize to the transaction pooler port.
            DATABASE_URL="${SUPABASE_DATABASE_URL/:5432\//:6543/}"
          else
            echo "::error::No usable Supabase DB credentials — set SUPABASE_DATABASE_PASSWORD (production env secret) or a postgresql:// SUPABASE_DATABASE_URL"
            exit 1
          fi
          export DATABASE_URL
          npm run db:migrate --workspace=@wic/api
          # WIC-905: apply idempotent RLS + role grants, then fail the deploy if any
          # user-scoped table is not RLS-enforced (defense-in-depth for the publishable key).
          npm run db:rls --workspace=@wic/api
          npm run db:rls:verify --workspace=@wic/api

      - name: Build for production
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Client-side analytics sink (WIC-899). Bakes the PostHog client sink into
          # the SPA bundle so the 6 WIC-814 client events emit in prod. Mirrors the
          # server sink flipped in WIC-821; the phc_ ingest key is a public,
          # browser-safe write key (that's how PostHog client capture works).
          # Fails closed: an unset VITE_POSTHOG_KEY normalizes to the noop sink.
          VITE_ANALYTICS_SINK: posthog
          VITE_POSTHOG_HOST: https://us.i.posthog.com
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - name: Prepare DATABASE_URL (transaction pooler port 6543)
        run: |
          # Permanent fix: set SUPABASE_DATABASE_URL to the full PostgreSQL transaction-pooler URL
          # from Supabase dashboard → Settings → Database → Connection string → Transaction pooler.
          # SUPABASE_DATABASE_URL is still the https:// REST URL, so reconstruct from known parts.
          # Use SUPABASE_POOLER_REGION variable (default: us-east-1) to set the correct region.
          # Use SUPABASE_POOLER_PREFIX variable (default: aws-1) to set the correct pooler prefix.
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed 's|https://||' | sed 's|\.supabase\.co.*||')
          REGION="${SUPABASE_POOLER_REGION:-us-east-1}"
          PREFIX="${SUPABASE_POOLER_PREFIX:-aws-1}"
          if [ -n "$SUPABASE_DATABASE_PASSWORD" ]; then
            # Primary path: reconstruct from parts so a malformed/placeholder SUPABASE_DATABASE_URL
            # cannot break URL parsing. URL-encode the password so special characters are safe.
            ENC_PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DATABASE_PASSWORD"], safe=""))')
            DATABASE_URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@${PREFIX}-${REGION}.pooler.supabase.com:6543/postgres"
          elif [[ "$SUPABASE_DATABASE_URL" == postgresql://* ]]; then
            # Fallback: a full Postgres URL was provided directly — normalize to the transaction pooler port.
            DATABASE_URL="${SUPABASE_DATABASE_URL/:5432\//:6543/}"
          else
            echo "::error::No usable Supabase DB credentials — set SUPABASE_DATABASE_PASSWORD (production env secret) or a postgresql:// SUPABASE_DATABASE_URL"
            exit 1
          fi
          echo "DATABASE_URL=${DATABASE_URL}" >> "$GITHUB_ENV"
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DATABASE_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
          SUPABASE_POOLER_REGION: ${{ vars.SUPABASE_POOLER_REGION }}
          SUPABASE_POOLER_PREFIX: ${{ vars.SUPABASE_POOLER_PREFIX }}

      - name: Ensure production R2 bucket exists
        run: npx wrangler r2 bucket create jobtrail-documents || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account-scoped tokens can't enumerate /memberships; pin the account so wrangler skips that lookup.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            ANTHROPIC_API_KEY
            SUPABASE_URL
            SUPABASE_ANON_KEY
            SUPABASE_JWT_SECRET
            DATABASE_URL
            POSTHOG_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account-scoped tokens can't enumerate /memberships; pin the account so `wrangler secret bulk` skips that lookup.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          # DATABASE_URL set to port-6543 transaction pooler URL by the preceding step
          # Analytics sink (WIC-821). ANALYTICS_SINK=posthog + POSTHOG_HOST are non-secret
          # and live in wrangler.jsonc [vars]; only the write key is a secret and is pushed
          # here from the GitHub `production` environment. If POSTHOG_API_KEY is unset the
          # API's config falls back to the noop sink with a warning, so this stays safe.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
