# WIC-1293 — Supabase free-tier keep-alive.
#
# WHY THIS EXISTS
#   Supabase free-tier projects auto-pause after ~7 consecutive days with no
#   database activity. When the production project paused, it took down ALL
#   product authentication: the browser calls the same-origin `/api/*` Worker,
#   the Worker calls Supabase, and every login returned
#   `AUTH_ERROR` with an empty `{}` message (WIC-1281, a total user-facing
#   outage). Restoring it required the account owner in the Supabase console --
#   no agent could self-heal it. Prevention is therefore the only real fix.
#
#   This workflow keeps both projects out of the idle window by opening a real
#   Postgres connection and running a single read-only `SELECT 1` on a cadence
#   comfortably shorter than the pause threshold.
#
# THIS IS NOT A DEPLOY
#   The only statement executed is `SELECT 1`. No migration, no schema change,
#   no writes, no artifact published, nothing promoted to any environment. It is
#   a read-only liveness touch, which is why it is safe to run unattended.
#
# CADENCE
#   `*/3` on day-of-month yields days 1,4,...,28,31 -> the largest gap between
#   consecutive runs is 3 days (including across month boundaries, where 31 -> 1
#   is only 1 day). That is a >2x margin against the ~7-day pause window, so a
#   single skipped or failed run still cannot let a project lapse.
#
# TWO IMPORTANT CAVEATS
#   1. `schedule:` only fires from the repository's DEFAULT branch. Until this
#      file is merged to `main` it is completely inert -- living on a feature
#      branch registers nothing (same trap as WIC-1113).
#   2. GitHub automatically disables scheduled workflows in repositories with
#      60 days of no activity. This repo is active, but if it ever goes quiet,
#      this protection goes quiet with it.
#
# CREDENTIALS
#   Requires no new secret. Both the `dev` and `production` environments already
#   carry `SUPABASE_DATABASE_PASSWORD` plus the `SUPABASE_URL` /
#   `SUPABASE_POOLER_REGION` variables, which is everything needed to rebuild the
#   transaction-pooler URL exactly the way deploy.yml already does.

name: Supabase keep-alive & prod auth canary

# Two independent liveness touches share this workflow (WIC-1296 asked that the auth
# probe fold in here rather than spawn a second cron file):
#   * keepalive     — read-only `SELECT 1` every 3rd day, keeps the free-tier projects
#                     out of the auto-pause window (WIC-1293).
#   * auth-canary   — nominally every 15 min, runs TWO independent probes against prod
#                     and fails the run if EITHER regresses, without one masking the other:
#                       - auth plane: POSTs invalid canary credentials to `/api/auth/login`
#                         and asserts a STRUCTURED rejection, catching the WIC-1281
#                         total-auth outage every existing monitor stayed green through.
#                       - data plane: GETs `/api/health` and asserts HTTP 200 + status:ok,
#                         catching the WIC-2092 Hyperdrive/pooler egress outage the auth
#                         probe is structurally blind to (it never dials Postgres). The
#                         `/api/health` liveness check existed (WIC-1296) but nothing
#                         polled it, so a ~10-day 503 went unseen by every monitor (WIC-2123).
# Each job is gated on which schedule fired, so the canary cadence does NOT drag the
# keep-alive `SELECT 1` along with it.
#
# ⚠️ ACTUAL CANARY CADENCE IS BEST-EFFORT, NOT 15 MIN (WIC-2125, measured 2026-09-05).
#   GitHub Actions does NOT guarantee `schedule` delivery: high-frequency crons are
#   throttled and silently dropped, worst near the top of the hour. Over 194.5h this
#   canary delivered 39 of ~778 expected `*/15` ticks = 5.0%, median gap 191 min, with
#   a measured 67h window that had no canary at all. Every delivered run succeeded and
#   none were cancelled, so the loss is GitHub never *creating* the run — not this
#   workflow's `concurrency` group and not any `[skip ci]`/`[skip deploy]` marker (those
#   affect push/PR triggers only, never `schedule`). The offset cron below is a partial
#   mitigation, NOT a guarantee. Effective MTTD for a prod outage is HOURS, not 15 min.
#   The durable fix (a Cloudflare Worker Cron Trigger, immune to Actions throttling) is
#   tracked separately and is human-gated on a credential no agent holds. Do not restate
#   "every 15 minutes" as fact anywhere without re-measuring delivery first.

on:
  schedule:
    # 06:17 UTC, every third day. Offset off the hour to avoid the
    # top-of-hour scheduling congestion that delays GitHub cron runs.
    # -> keepalive job only.
    - cron: '17 6 */3 * *'
    # auth-canary job only. Nominal 15-min interval, OFFSET off the top of the hour
    # (7,22,37,52 instead of 0,15,30,45) to dodge GitHub's worst scheduling congestion
    # (WIC-2125). This is a best-effort mitigation: GitHub still drops most high-frequency
    # ticks (measured 5% delivery), so treat the real cadence as hours, not 15 min.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  # Per-schedule group so a slow 3-day keep-alive never cancels or queues behind a
  # canary run (and vice versa). cancel-in-progress stays off: never kill a touch.
  group: supabase-keepalive-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keepalive:
    name: keep-alive (${{ matrix.env }})
    # Only the 3-day cron (and manual dispatch) — never the canary schedule.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '17 6 */3 * *'
    runs-on: ubuntu-latest
    strategy:
      # Never let one dead project stop the other from being kept alive.
      # While production was paused, dev still needed its own touch.
      fail-fast: false
      matrix:
        env: [dev, production]
    environment: ${{ matrix.env }}
    timeout-minutes: 5

    steps:
      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            echo "psql not present on the runner image; installing postgresql-client"
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Touch the database (read-only SELECT 1)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DATABASE_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
          SUPABASE_POOLER_REGION: ${{ vars.SUPABASE_POOLER_REGION }}
          SUPABASE_POOLER_PREFIX: ${{ vars.SUPABASE_POOLER_PREFIX }}
        run: |
          set -euo pipefail

          # Rebuild the transaction-pooler URL from known parts, mirroring the
          # migration steps in deploy.yml. PROJECT_REF is derived from the
          # https:// REST SUPABASE_URL var; SUPABASE_DATABASE_URL is frequently
          # still the REST URL rather than a postgresql:// DSN, so the password
          # path is preferred and the DSN is only a fallback.
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL variable is not set for the '${{ matrix.env }}' environment"
            exit 1
          fi

          PROJECT_REF=$(echo "$SUPABASE_URL" | sed 's|https://||' | sed 's|\.supabase\.co.*||')
          REGION="${SUPABASE_POOLER_REGION:-us-east-1}"
          PREFIX="${SUPABASE_POOLER_PREFIX:-aws-1}"

          if [ -n "${SUPABASE_DATABASE_PASSWORD:-}" ]; then
            ENC_PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DATABASE_PASSWORD"], safe=""))')
            DATABASE_URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@${PREFIX}-${REGION}.pooler.supabase.com:6543/postgres"
          elif [[ "${SUPABASE_DATABASE_URL:-}" == postgresql://* ]]; then
            DATABASE_URL="${SUPABASE_DATABASE_URL/:5432\//:6543/}"
          else
            echo "::error::No usable Supabase DB credentials for '${{ matrix.env }}' — set SUPABASE_DATABASE_PASSWORD or a postgresql:// SUPABASE_DATABASE_URL"
            exit 1
          fi

          echo "Project ref : ${PROJECT_REF}"
          echo "Pooler host : ${PREFIX}-${REGION}.pooler.supabase.com:6543"

          # Capture output so a paused project can be reported distinctly from a
          # rotated password or a network fault. Never echo DATABASE_URL: it
          # embeds the password.
          set +e
          OUT=$(psql "$DATABASE_URL" \
                  --no-psqlrc --quiet --tuples-only --no-align \
                  -v ON_ERROR_STOP=1 \
                  -c 'SELECT 1;' 2>&1)
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "✅ ${{ matrix.env }} (${PROJECT_REF}) is awake — SELECT 1 returned: ${OUT}"
            exit 0
          fi

          # `Tenant or user not found` is what the shared regional pooler returns
          # for a project that is paused (or whose ref/password no longer
          # resolves). This is the exact error that killed every production
          # migration during WIC-1281, so name it explicitly.
          if echo "$OUT" | grep -qi 'tenant or user not found'; then
            echo "::error::${{ matrix.env }} (${PROJECT_REF}) is PAUSED or its credentials no longer resolve — the pooler reported 'Tenant or user not found'. Only the Supabase account owner can restore a paused project from the console; no automation can. See WIC-1281."
          else
            echo "::error::${{ matrix.env }} (${PROJECT_REF}) keep-alive failed: ${OUT}"
          fi
          exit 1

  # WIC-1296 / WIC-1284 — Synthetic production auth probe.
  #
  # WHY THIS EXISTS
  #   Under WIC-1281 the production Supabase project paused and EVERY login broke,
  #   yet not one monitor went red. The reason is structural: `GET /api/*` runs the
  #   JWT auth middleware first and returns 401 *before* it ever touches Postgres, so
  #   an authenticated health check can never observe a DB outage. This probe instead
  #   exercises the one unauthenticated path that must reach Supabase — the login
  #   handler — and asserts the DB actually answered.
  #
  # WHAT IT ASSERTS  (this is the whole point; read before editing)
  #   A *healthy* invalid-credential login returns HTTP 401 with a STRUCTURED body:
  #       {"error":{"code":"AUTH_ERROR","message":"Invalid login credentials"}}
  #   That exact message only appears once Supabase has validated the credentials, so
  #   it is proof the request reached a live database. During the WIC-1281 outage the
  #   SAME endpoint returned 401 with an EMPTY "{}" message, because Supabase was
  #   paused before it could validate. HTTP status is therefore NOT the discriminator
  #   — the message text is. PASS iff `.error.message == "Invalid login credentials"`.
  #   FAIL on anything else: empty/"{}" message, any 5xx, non-JSON, or an unreachable host.
  #
  # SAFETY
  #   Invalid-credential login only. `signInWithPassword` is read-only; it never
  #   creates an account and never mutates state. The canary account does not exist
  #   and the password is deliberately wrong, so this can only ever be rejected. No
  #   secret is required — a real credential would defeat the purpose.
  auth-canary:
    name: prod canary (auth + data plane)
    # Only the canary cron (and manual dispatch) — never the 3-day keep-alive schedule.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '7,22,37,52 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Probe prod /api/auth/login with invalid canary credentials
        env:
          # Prod base URL. Overridable via a repo variable; defaults to production.
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://app.careerpin.app' }}
        run: |
          set -uo pipefail
          # app.careerpin.app is the API Worker; the bare apex serves the marketing
          # site and 405s POST /api/auth/login. Do not point the canary at the apex.
          BASE="${PROD_BASE_URL:-https://app.careerpin.app}"
          URL="${BASE%/}/api/auth/login"
          # A non-existent canary account with a deliberately-wrong password. This can
          # never authenticate and never mutates state (signInWithPassword only reads).
          EMAIL="auth-canary-invalid@careerpin.app"
          PW="wic1296-synthetic-canary-not-a-real-password" # secret-scan:allow — deliberately-invalid synthetic canary credential (WIC-1296); it can never authenticate and is not a real secret

          echo "Probing ${URL} with invalid canary credentials"
          RESP=$(curl -sS -m 25 -w $'\n%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST "$URL" \
            --data "{\"email\":\"${EMAIL}\",\"password\":\"${PW}\"}" 2>/tmp/curl.err)
          CURL_RC=$?
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          echo "curl rc=${CURL_RC} http=${CODE}"
          echo "body=${BODY}"

          if [ "$CURL_RC" -ne 0 ]; then
            VERDICT="🔴 AUTH PLANE: could NOT reach ${URL} (curl rc=${CURL_RC}: $(cat /tmp/curl.err)). Production auth may be unreachable."
            echo "AUTH_VERDICT=${VERDICT}" >> "$GITHUB_ENV"
            echo "::error::${VERDICT} See WIC-1281/WIC-1296."
            exit 1
          fi

          if [ "${CODE:-0}" -ge 500 ]; then
            VERDICT="🔴 AUTH PLANE: HTTP ${CODE} from ${URL} — a 5xx means the auth stack itself is failing server-side."
            echo "AUTH_VERDICT=${VERDICT}" >> "$GITHUB_ENV"
            echo "::error::${VERDICT} See WIC-1281/WIC-1296."
            exit 1
          fi

          # Extract .error.message; exit 3 on non-JSON / unparseable body.
          cat > "${RUNNER_TEMP:-/tmp}/parse_auth.py" <<'PY'
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception:
              sys.exit(3)
          print((d.get("error") or {}).get("message", ""))
          PY
          MSG=$(printf '%s' "$BODY" | python3 "${RUNNER_TEMP:-/tmp}/parse_auth.py")
          PARSE_RC=$?

          if [ "$PARSE_RC" -eq 3 ]; then
            VERDICT="🔴 AUTH PLANE: NON-JSON / unparseable body from ${URL} (http ${CODE}). Production auth is degraded — the WIC-1281 outage signature."
            echo "AUTH_VERDICT=${VERDICT}" >> "$GITHUB_ENV"
            echo "::error::${VERDICT} See WIC-1281/WIC-1296."
            exit 1
          fi

          if [ "$MSG" = "Invalid login credentials" ]; then
            VERDICT="✅ AUTH PLANE: LIVE — structured rejection 'Invalid login credentials' at HTTP ${CODE}. The login path reached Supabase and it validated."
            echo "AUTH_VERDICT=${VERDICT}" >> "$GITHUB_ENV"
            echo "$VERDICT"
            exit 0
          fi

          VERDICT="🔴 AUTH PLANE FAILED: expected HTTP 401 with message 'Invalid login credentials' but got http=${CODE} message='${MSG}'. An empty/'{}'/AUTH_ERROR-without-validation body is the exact WIC-1281 signature — production auth may be DOWN and no other monitor catches this."
          echo "AUTH_VERDICT=${VERDICT}" >> "$GITHUB_ENV"
          echo "::error::${VERDICT} See WIC-1296."
          exit 1

      # WIC-2123 — Synthetic production DATA-PLANE probe.
      #
      # WHY THIS EXISTS
      #   Production's data plane returned `503` for ~10 days (WIC-2092) and not one
      #   monitor went red. The auth canary above is structurally blind to it: it
      #   proves Supabase Auth REST is up, but it never dials Postgres, so a
      #   Hyperdrive/pooler egress fault is invisible to it. Every other green signal
      #   is blind too — `GET /api/*` returns 401 before Postgres is dialled, and the
      #   keep-alive `SELECT 1` is gated to the 3-day schedule, not this canary one.
      #   `/api/health` became a real, unauthenticated liveness check under WIC-1296,
      #   but nothing polled it. This step is that missing consumer.
      #
      # WHAT IT ASSERTS  (read before editing)
      #   A *healthy* data plane returns HTTP 200 with body `{"status":"ok",...}`. PASS
      #   iff HTTP 200 AND `.status == "ok"`. FAIL on anything else — the live outage
      #   signature is HTTP 503 with `{"status":"degraded","hyperdrive":false,
      #   "db":"write CONNECTION_DESTROYED ..."}`. The failure names the observed
      #   `hyperdrive` and `db` fields verbatim so the incident issue is self-diagnosing.
      #
      #   `if: always()` so a failing auth probe never masks the data-plane verdict, and
      #   vice versa — both probes run every time and each records an independent verdict.
      #
      # SAFETY
      #   Read-only, unauthenticated GET. No credentials, no state change.
      - name: Probe prod data plane (GET /api/health)
        id: data-plane
        if: always()
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://app.careerpin.app' }}
        run: |
          set -uo pipefail
          BASE="${PROD_BASE_URL:-https://app.careerpin.app}"
          URL="${BASE%/}/api/health"

          echo "Probing ${URL} for data-plane liveness"
          RESP=$(curl -sS -m 25 -w $'\n%{http_code}' "$URL" 2>/tmp/health_curl.err)
          CURL_RC=$?
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          echo "curl rc=${CURL_RC} http=${CODE}"
          echo "body=${BODY}"

          if [ "$CURL_RC" -ne 0 ]; then
            VERDICT="🔴 DATA PLANE: could NOT reach ${URL} (curl rc=${CURL_RC}: $(cat /tmp/health_curl.err)). Production data plane is unreachable."
            echo "DATAPLANE_VERDICT=${VERDICT}" >> "$GITHUB_ENV"
            echo "::error::${VERDICT} See WIC-2123/WIC-2092."
            exit 1
          fi

          # Extract status/hyperdrive/db (tab-separated). "__PARSE_ERROR__" on non-JSON.
          cat > "${RUNNER_TEMP:-/tmp}/parse_health.py" <<'PY'
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception:
              print("__PARSE_ERROR__"); sys.exit(0)
          def g(k):
              if k not in d:
                  return "<absent>"
              v = d[k]
              # Render booleans/null verbatim as JSON does (false/true/null), strings as-is.
              return v if isinstance(v, str) else json.dumps(v)
          print("\t".join([g("status"), g("hyperdrive"), g("db")]))
          PY
          PARSED=$(printf '%s' "$BODY" | python3 "${RUNNER_TEMP:-/tmp}/parse_health.py")

          if [ "$PARSED" = "__PARSE_ERROR__" ]; then
            VERDICT="🔴 DATA PLANE: /api/health returned http=${CODE} with a NON-JSON body: ${BODY}"
            echo "DATAPLANE_VERDICT=${VERDICT}" >> "$GITHUB_ENV"
            echo "::error::${VERDICT} See WIC-2123/WIC-2092."
            exit 1
          fi

          STATUS=$(printf '%s' "$PARSED" | cut -f1)
          HYPERDRIVE=$(printf '%s' "$PARSED" | cut -f2)
          DB=$(printf '%s' "$PARSED" | cut -f3)

          if [ "${CODE:-0}" = "200" ] && [ "$STATUS" = "ok" ]; then
            VERDICT="✅ DATA PLANE: LIVE — /api/health http=200 status=ok (hyperdrive=${HYPERDRIVE}, db=${DB})."
            echo "DATAPLANE_VERDICT=${VERDICT}" >> "$GITHUB_ENV"
            echo "$VERDICT"
            exit 0
          fi

          VERDICT="🔴 DATA PLANE DOWN: /api/health http=${CODE} status='${STATUS}' hyperdrive='${HYPERDRIVE}' db='${DB}'. Expected http=200 status=ok. This is the WIC-2092 Hyperdrive/pooler egress outage that the auth canary is structurally blind to."
          echo "DATAPLANE_VERDICT=${VERDICT}" >> "$GITHUB_ENV"
          echo "::error::${VERDICT} See WIC-2123/WIC-2092."
          exit 1

      - name: Surface a failure where a human will see it
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no `actions/checkout`, so `gh` cannot infer the repo from a
          # git remote and every `gh issue` call fails with "not a git repository".
          # GH_REPO makes the target explicit and removes the checkout dependency.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE="🔴 Prod canary FAILED — production auth or data plane may be down"
          BODY=$(printf 'The scheduled production canary failed. It runs TWO independent probes and reports both verdicts below; a failure in either plane fails the run without masking the other.\n\n- %s\n- %s\n\n**Auth plane** POSTs invalid canary credentials to `/api/auth/login` and expects the structured rejection `Invalid login credentials`, which only a live Supabase produces (WIC-1281/WIC-1296). It never dials Postgres.\n**Data plane** GETs `/api/health` and expects HTTP 200 with `status:ok`; HTTP 503 with `hyperdrive:false` / a destroyed `db` connection is the WIC-2092 Hyperdrive/pooler egress outage the auth probe is structurally blind to (WIC-2123). No other monitor catches this — `GET /api/*` returns 401 before Postgres is dialled, and the keep-alive `SELECT 1` runs only on the 3-day schedule.\n\n⚠️ **Cadence caveat (WIC-2125):** this canary is scheduled every 15 min but GitHub Actions delivers only ~5%% of high-frequency `schedule` ticks (measured: 39 of ~778 over 194.5h; median gap ~3h; up to a 67h blind window). Absence of this alert does NOT mean prod is healthy — effective MTTD is hours, not minutes. The durable fix is a Cloudflare Worker Cron Trigger (tracked in WIC-2125), human-gated on a credential.\n\nFailing run: %s\n\nRunbook: WIC-2092 (data plane — Hyperdrive provisioning is human-gated), WIC-1296 / WIC-1281 (auth plane). A paused Supabase project can only be restored by the account owner in the console.' "${AUTH_VERDICT:-⚠️ AUTH PLANE: no verdict recorded (probe did not run)}" "${DATAPLANE_VERDICT:-⚠️ DATA PLANE: no verdict recorded (probe did not run)}" "$RUN_URL")
          # Dedup: comment on the standing incident issue if one is already open,
          # else open a fresh one. Avoids a new issue on every canary run during an outage.
          EXISTING=$(gh issue list --state open --search "in:title \"Prod canary FAILED\"" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" --body "$BODY" && echo "Commented on open incident issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --body "$BODY" && echo "Opened a new incident issue"
          fi
