name: Skip-CI Guard

# WIC-1212. `[skip ci]` (and its siblings) suppress BOTH the `push` and the
# `pull_request` event. A PR whose head commit carries one therefore reports
# zero check runs, which GitHub renders as MERGEABLE — and if its base is not
# `main` it also escapes REVIEW_REQUIRED, so it reads MERGEABLE / CLEAN: the
# most merge-ready-looking state in the repo, with no build evidence behind it.
#
# WIC-1877 — THE RULE CHANGED. This guard used to permit a GitHub-native skip
# marker on a docs/markdown/workflow-only PR (the "no-deploy merge route"). That
# carve-out was wrong: three of the audits in `Lint & Test` gate ONLY docs
# (`doc-reference-audit`, `route-title-table-audit`, `wireframe-casing-audit`),
# so `[skip ci]` on a docs change suppressed exactly the checks that exist to
# verify it — permitted AND unverified. `f07b9f6` landed a dangling ADR citation
# on `main` that way and went unseen ~2.5h. The no-deploy route now uses
# `[skip deploy]` (see deploy.yml): NOT a GitHub directive, so the run still
# fires and `Lint & Test` still runs; only `deploy-production` is gated off.
#
# So a GitHub-native CI-skip marker on a PR head is now NEVER allowed — it always
# means zero build evidence. This guard fails on any such marker regardless of
# which paths changed, and points the author at `[skip deploy]` instead.
# (`[skip deploy]` is not a suppressor and is not matched here; a PR using it
# passes as an ordinary PR and its checks run.)
#
# WHY `pull_request_target` AND WHY A SEPARATE FILE:
# GitHub's skip directive applies to `push` and `pull_request` only. If this job
# lived in deploy.yml, the very commits it exists to catch would suppress it.
# `pull_request_target` is not skippable, so the guard always produces a check
# run — which is also what stops these PRs from reading as zero-check at all.
#
# SECURITY: `pull_request_target` runs in the context of the BASE branch with
# access to secrets. This job therefore NEVER checks out or executes PR head
# code — there is no actions/checkout step and no run: step touching the PR. It
# reads only the changed-file list and the head commit message over the API, and
# it downgrades its own token to read-only below.

on:
  pull_request_target:
    # `branches:` filters the BASE branch. `['**']` so stacked PRs are covered
    # too (same lesson as WIC-1138 / #94).
    branches: ['**']
    # `edited` is included on purpose: it is the only event emitted when a PR is
    # retargeted to a new base, and a retarget emits no push/synchronize, so
    # without it a retargeted PR would keep a stale verdict.
    types: [opened, synchronize, reopened, edited]

# Read-only. `pull_request_target` would otherwise hand this job a write token.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: skip-ci-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Skip-CI marker on a PR head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject any GitHub-native CI-skip marker on the PR head
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // GitHub's documented skip keywords, plus the `skip-checks` trailer.
            // Matched ANYWHERE in the commit message, not just the subject:
            // measured 2026-08-20 on PR #100 head fd77ddb2, whose subject was
            // clean but whose body mentioned `[skip ci]` in prose (inside
            // backticks, 26 lines down) — 0 workflow runs, 0 check suites. The
            // marker is not confined to the first line, so neither is this.
            const SKIP_PATTERNS = [
              /\[\s*skip[ _-]?ci\s*\]/i,
              /\[\s*ci[ _-]?skip\s*\]/i,
              /\[\s*no[ _-]?ci\s*\]/i,
              /\[\s*skip[ _-]?actions\s*\]/i,
              /\[\s*actions[ _-]?skip\s*\]/i,
              /\*\*\*NO_CI\*\*\*/i,
              /^\s*skip-checks:\s*true\s*$/im,
            ];

            const { data: commit } = await github.rest.repos.getCommit({
              owner, repo, ref: pr.head.sha,
            });
            const message = commit.commit.message || '';
            const marker = SKIP_PATTERNS.find((re) => re.test(message));

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const paths = files.map((f) => f.filename);

            const summary = core.summary
              .addHeading('Skip-CI Guard', 2)
              .addRaw(`Head commit: \`${pr.head.sha.slice(0, 8)}\`\n\n`)
              .addRaw(`Skip marker: ${marker ? `**present** (\`${message.match(marker)[0]}\`)` : 'absent'}\n\n`)
              .addRaw(`Changed files: ${paths.length}\n\n`);

            if (!marker) {
              summary.addRaw('No GitHub-native CI-skip marker on the head commit, so this PR is built by the normal `pull_request` workflows. Nothing to enforce. (To land without a production deploy, use `[skip deploy]` — it is not a suppressor, so the checks still run.)\n');
              await summary.write();
              core.info(`PASS: no skip marker on ${pr.head.sha}.`);
              return;
            }

            // WIC-1877: any GitHub-native skip marker on a PR head is rejected.
            // It suppresses BOTH `push` and `pull_request`, so the PR merges with
            // zero build evidence — including the docs audits in `Lint & Test`.
            // The no-deploy route is `[skip deploy]`, which keeps the checks.
            summary
              .addRaw('### Blocked\n\n')
              .addRaw('This PR carries a **GitHub-native CI-skip marker**, which suppresses both the `push` and `pull_request` events. It would merge with no build evidence at all — zero check runs (which GitHub renders as mergeable), and in particular none of the `docs/`-gating audits in `Lint & Test`.\n\n')
              .addRaw('**Fix — use `[skip deploy]` instead.** It is not a GitHub directive, so the workflow still runs and `Lint & Test` (with its docs/analytics audits) still verifies the change; only the production deploy is gated off. Amend the head commit to drop the `[skip ci]`-family marker (it is matched **anywhere** in the message, including prose inside backticks — remove it from the body too, or spell it without the brackets), add `[skip deploy]` if you want to skip the deploy, and force-push.\n');
            await summary.write();

            core.setFailed(
              `Head commit ${pr.head.sha.slice(0, 8)} carries a GitHub-native ` +
              `CI-skip marker ("${message.match(marker)[0]}"). It suppresses both ` +
              `push and pull_request, so the PR has zero check runs — including the ` +
              `docs audits in Lint & Test — yet still reports as mergeable. ` +
              `Use [skip deploy] to skip the deploy while keeping the checks; ` +
              `drop the skip marker (anywhere in the message, body included) and force-push.`
            );
