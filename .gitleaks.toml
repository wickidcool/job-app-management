# Addendum A Rev 5 — fleet rule extension.
# Extends the gitleaks default rule set; does NOT replace it.
[extend]
useDefault = true

# WIC-1070: a Google OAuth *refresh* token sat in public git history from 2020.
# GitHub's scanner flags it (google_oauth_refresh_token); gitleaks' default set does NOT.
# Refresh tokens are the long-lived half of the credential pair, so this is the one that matters.
[[rules]]
id = "google-oauth-refresh-token"
description = "Google OAuth refresh token"
regex = '''1//0[A-Za-z0-9_\-]{30,}'''
keywords = ["1//0"]
[rules.allowlist]
regexTarget = "match"
regexes = ['''1//0[0]{30,}''']   # all-zero placeholders used in docs/fixtures

# Google OAuth access token. Default set only catches these incidentally via
# generic-api-key, which needs an adjacent keyword and so is not reliable.
[[rules]]
id = "google-oauth-access-token"
description = "Google OAuth access token"
regex = '''ya29\.[A-Za-z0-9_\-]{20,}'''
keywords = ["ya29."]

# WIC-1130 / ADR-0001 Addendum A Rev 6.2 §A.2 — DB/broker connection string with an
# embedded credential (userinfo form). gitleaks' 222-rule default set has no rule for
# this class; `generic-api-key` covers the libpq `password=` and `?password=` forms but
# misses `scheme://user:pass@host`, which is exactly the form Supabase hands you.
# Allowlist is STRUCTURAL ONLY (Rev 6.2 §A.2.2) — corpus-derived suppression belongs in
# the per-repo redacted baseline, never in fleet-distributed config.
[[rules]]
id = "pc-db-connection-string"
description = "Database/broker connection string with an embedded credential (userinfo form)"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?|mssql|sqlserver|clickhouse|cockroachdb|snowflake)://[^:@/\s"'<>]{1,64}:[^@/\s"'<>]{1,256}@[^/\s"'<>]+'''
keywords = ["://"]
tags = ["adr-0001", "db-credential"]

  [rules.allowlist]
  regexTarget = "match"
  regexes = ['''(?i)://[^@\s]*(?:\$\{|\$\(|\{\{|%\(|%s|<[a-z_][a-z0-9_-]*>|\[[a-z_][a-z0-9_-]*\]|\*{3,}|x{8,}|redacted|your[-_]?password|changeme|placeholder)[^@\s]*@''']
