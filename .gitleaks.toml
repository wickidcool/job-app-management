# Addendum A Rev 6 — fleet rule extension. (Rev 6: WIC-2367 — tuned allowlists.)
# Extends the gitleaks default rule set; does NOT replace it.
[extend]
useDefault = true

# WIC-2367: global structural allowlist for default rules that cannot be extended
# per-rule in the extend.useDefault model.  regexTarget="match" runs against the
# full Match field (key=value context), not just the secret.  Entries here are
# STRUCTURAL ONLY (Rev 6.2 §A.2.2) — patterns that are never a real credential
# by construction, not by corpus inspection.
[allowlist]
description = "Structural suppression for default rules (WIC-2367)"
regexTarget = "match"
regexes = [
  # JWT HS256 header constant followed by a literal ellipsis.  Decodes to
  # {"alg":"HS256","typ":"JWT"} — the public header segment, no payload, no
  # signature.  Every HS256 token shares this prefix; the ellipsis means the
  # author intentionally truncated the example.  Zero entropy per construction.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.{3}''',  # secret-scan:allow — this IS the suppression pattern for the public JWT HS256 header; the literal is the header constant itself (decodes to {"alg":"HS256","typ":"JWT"}), not a credential (WIC-2367)
  # JSON "_key" field whose value is an alphanumeric identifier (metric / dashboard key).
  # The field name "_key" is a HogQL/PostHog convention for naming a metric series;
  # its value is never an API key — it is always a short snake_case label.
  '''^_key":\s*"[A-Za-z][A-Za-z0-9_]+"$''',
]

# WIC-1070: a Google OAuth *refresh* token sat in public git history from 2020.
# GitHub's scanner flags it (google_oauth_refresh_token); gitleaks' default set does NOT.
# Refresh tokens are the long-lived half of the credential pair, so this is the one that matters.
[[rules]]
id = "google-oauth-refresh-token"
description = "Google OAuth refresh token"
regex = '''1//0[A-Za-z0-9_\-]{30,}'''
keywords = ["1//0"]
[rules.allowlist]
regexTarget = "match"
regexes = ['''1//0[0]{30,}''']   # all-zero placeholders used in docs/fixtures

# Google OAuth access token. Default set only catches these incidentally via
# generic-api-key, which needs an adjacent keyword and so is not reliable.
[[rules]]
id = "google-oauth-access-token"
description = "Google OAuth access token"
regex = '''ya29\.[A-Za-z0-9_\-]{20,}'''
keywords = ["ya29."]

# WIC-1130 / ADR-0001 Addendum A Rev 6.2 §A.2 — DB/broker connection string with an
# embedded credential (userinfo form). gitleaks' 222-rule default set has no rule for
# this class; `generic-api-key` covers the libpq `password=` and `?password=` forms but
# misses `scheme://user:pass@host`, which is exactly the form Supabase hands you.
# Allowlist is STRUCTURAL ONLY (Rev 6.2 §A.2.2) — corpus-derived suppression belongs in
# the per-repo redacted baseline, never in fleet-distributed config.
[[rules]]
id = "pc-db-connection-string"
description = "Database/broker connection string with an embedded credential (userinfo form)"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?|mssql|sqlserver|clickhouse|cockroachdb|snowflake)://[^:@/\s"'<>]{1,64}:[^@/\s"'<>]{1,256}@[^/\s"'<>]+'''
keywords = ["://"]
tags = ["adr-0001", "db-credential"]

  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    # Userinfo half is a placeholder, so no credential is named.
    #
    # These tokens are distinctive enough that a substring ("contains") match is
    # safe — no real credential contains `${`, `<foo>`, `redacted` or `changeme`.
    # ⛔ `x{8,}` stays at 8: Rev 6 loosened it to `x{3,}`, which suppresses any
    # real password containing "xxx" (e.g. `Rxxxq7ZmNt4w`). Short/ambiguous
    # placeholders belong in the ANCHORED entry below, not in this alternation.
    '''(?i)://[^@\s]*(?:\$\{|\$\(|\{\{|%\(|%s|<[a-z_][a-z0-9_-]*>|\[[a-z_][a-z0-9_-]*\]|\*{3,}|x{8,}|redacted|your[-_]?password|changeme|placeholder)[^@\s]*@''',
    # Rev 6.1 (WIC-2367): short placeholder tokens (`password`, `xxx`) are only
    # safe when they are the WHOLE component, never as a substring — otherwise
    # `mypassword123` and `Rxxxq7ZmNt4w` are silently suppressed.
    # Whole password component. `pw`/`pass` are 2-4 chars — too short to be a real
    # credential, but only safe anchored (`Rxxxq7ZmNt4w` contains neither as a
    # whole component). Covers the CHANGELOG prose example `postgres://user:pw@host/db`.
    '''(?i)://[^@\s]*:(?:password|passwd|pass|pw|x{3,})@''',
    # Whole username component (or its dot-suffixed tail, e.g. `postgres.xxx`):
    '''(?i)://(?:[^@\s:]*\.)?(?:password|x{3,})(?::[^@\s]*)?@''',
    # Rev 6.1 (WIC-2367): SCREAMING_CASE placeholder in userinfo, e.g.
    # `://postgres.PROJECT:PASSWORD@`.  The token must BE the whole component,
    # anchored between the `:`/`://` and the `@` — it is NOT enough for the
    # component to merely CONTAIN an uppercase run.
    #
    # ⛔ Do not relax this back to `[^@\s]*(?-i:[A-Z][A-Z0-9_]{3,})[^@\s]*@`.
    # That form suppressed any userinfo containing a 4+ char uppercase run
    # ANYWHERE, which is 67.6% of random 24-char alphanumeric passwords
    # (measured, 20k samples) — including the real prod pooler credential shape
    # `postgres.<ref>:Xk7PQRSTuvw2ndL@`.  It disarmed the rule it was tuning.
    # The MUST_CATCH cases in scripts/gitleaks-selftest.py pin this.
    #
    # Whole password component is a SCREAMING_CASE token.
    '''(?i)://[^@\s]*:(?-i:[A-Z][A-Z0-9_]{2,})@''',
    # No-password form: whole userinfo is a SCREAMING_CASE token.
    '''(?i)://(?-i:[A-Z][A-Z0-9_]{2,})@''',
    # WIC-2243: host half is provably non-routable, so the string cannot name a live
    # credential no matter what the userinfo says. Structural (host class), not
    # corpus-derived, so it belongs here rather than in the baseline (Rev 6.2 §A.2.2).
    # Loopback / unspecified address (RFC 5735).
    '''(?i)@(?:localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)(?::\d+)?$''',
    # RFC 2606 §2 reserved TLDs — guaranteed never resolvable.
    '''(?i)@[^@\s]*\.(?:invalid|test|example|localhost)(?::\d+)?$''',
    # RFC 2606 §3 reserved second-level example domains.
    '''(?i)@(?:[^@\s]*\.)?example\.(?:com|net|org)(?::\d+)?$''',
    # Rev 6.1 (WIC-2367): well-known container/compose service aliases only.
    #
    # ⛔ Do not widen this back to the generic single-label form
    # `@[a-z0-9][a-z0-9_-]*(:[a-z0-9]+)?$`.  "Dotless" is NOT the same structural
    # guarantee as loopback or an RFC 2606 reserved name: those can never name a
    # real host, whereas a dotless name resolves fine inside a private network,
    # so the credential beside it is a REAL credential.  The generic form
    # suppressed `postgresql://svc_user:aB3xQRSTuvWX9z@prod-db` — a genuine leak.
    # This enumerated list keeps the compose-fixture false positives suppressed
    # without granting every internal hostname a free pass.
    '''(?i)@(?:db|database|postgres|postgresql|mysql|mariadb|redis|mongo|mongodb|cache|queue)(?::\d+)?$''',
  ]
